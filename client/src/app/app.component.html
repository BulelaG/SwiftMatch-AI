<!-- ═════════════════════════════════════════════════════════════
     UBER FOR BUSINESS ENTERPRISE HEADER
     ═════════════════════════════════════════════════════════════ -->
<header class="uber-topbar">
  <div class="uber-topbar-inner">
    
    <!-- Left: Brand "SwiftMatch for Business" -->
    <div class="uber-brand-group">
      <a routerLink="/" class="uber-brand" aria-label="SwiftMatch for Business home">
        <span class="uber-brand-title">SwiftMatch</span>
        <span class="uber-brand-sub">for Business</span>
      </a>

      <!-- Center-Left Navigation Dropdown Pills (Uber style) -->
      <nav class="uber-nav-pills d-none d-lg-flex" aria-label="Main Navigation">
        <button type="button" class="uber-pill-btn" routerLink="/" [class.active]="true">
          <span>Overview</span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
        <button type="button" class="uber-pill-btn">
          <span>Solutions</span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
        <button type="button" class="uber-pill-btn">
          <span>Pricing &amp; B-BBEE</span>
        </button>
        <button type="button" class="uber-pill-btn">
          <span>Customer support</span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
        <button type="button" class="uber-pill-btn">
          <span>Resources</span>
          <i class="bi bi-chevron-down" aria-hidden="true"></i>
        </button>
      </nav>
    </div>

    <!-- Right: Language, Contact, and User Pill "Bulela" -->
    <div class="uber-right-group">
      <!-- Language / Region -->
      <button type="button" class="uber-icon-pill" title="Region: South Africa">
        <i class="bi bi-globe" aria-hidden="true"></i>
        <span>EN</span>
      </button>

      <!-- Contact us link -->
      <a href="https://github.com/BulelaG/Kasi-eCo" target="_blank" rel="noopener" class="uber-text-link d-none d-md-inline">
        Contact us
      </a>

      <!-- Theme Switcher -->
      <button type="button"
              class="uber-theme-pill"
              (click)="toggleTheme()"
              [attr.aria-pressed]="isDarkMode"
              [title]="isDarkMode ? 'Switch to light theme' : 'Switch to dark theme'">
        <i class="bi" [class.bi-moon-stars-fill]="isDarkMode" [class.bi-sun-fill]="!isDarkMode" aria-hidden="true"></i>
      </button>

      <!-- User Profile Pill: Bulela (Solid White Pill with Black Text) -->
      <div class="uber-user-pill" title="Logged in as Bulela (Procurement Director)">
        <span>Bulela</span>
      </div>
    </div>

  </div>
</header>

<main class="sm-main" id="main-content" tabindex="-1">
  <router-outlet></router-outlet>
</main>

<footer class="sm-footer uber-footer">
  <div class="sm-footer-inner">
    <div class="sm-footer-left">
      <span>Built for the <strong>YES AI Hackathon 2026</strong></span>
      <span class="sm-bullet" aria-hidden="true">•</span>
      <span>Challenge 4: SME–corporate opportunity matching</span>
    </div>
    <div class="sm-footer-right">
      <span>POPIA &amp; B-BBEE Level 1 Verification Engine</span>
      <span class="sm-bullet" aria-hidden="true">•</span>
      <span>Swift House</span>
    </div>
  </div>
</footer>
